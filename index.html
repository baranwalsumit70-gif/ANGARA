document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#737373\">INCLUDED WITH THIS RING<\u002Fspan>\n              <span style=\"font-size:14px;font-weight:600\">Lab-grown sapphire &amp; diamond shell stud earrings<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#737373\">Added to your bag automatically.<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n              <span style=\"font-size:12.5px;color:#737373;text-decoration:line-through\">$259<\u002Fspan>\n              <span style=\"font-size:15px;font-weight:600\">Free<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ addToBag }}\" style=\"cursor:pointer;font:inherit;width:100%;padding:16px;border-radius:10px;border:none;background:#0a0a0a;color:#fafafa;font-size:15px;font-weight:600;letter-spacing:-0.01em\" style-hover=\"opacity:.9\">{{ ctaText }}<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#404040\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"6\" width=\"15\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M16 10h4l3 3v5h-7\"><\u002Fpath><circle cx=\"6\" cy=\"18\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"18\" r=\"2\"><\u002Fcircle><\u002Fsvg>\n          <span>Free express delivery — arrives <strong style=\"font-weight:600\">Aug 24 – Aug 25<\u002Fstrong><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;gap:22px;font-size:13px;font-weight:500;color:#404040\">\n          <span style=\"text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Drop a hint<\u002Fspan>\n          <span style=\"text-decorati span style=\"color:#737373\">SKU<\u002Fspan><span style=\"font-weight:500\">SR1207S<\u002Fspan>\n                <span style=\"color:#737373\">Metal<\u002Fspan><span style=\"font-weight:500\">{{ metalSummary }}<\u002Fspan>\n                <span style=\"color:#737373\">Centre stone<\u002Fspan><span style=\"font-weight:500\">{{ stoneSummary }}<\u002Fspan>\n                <span style=\"color:#737373\">Setting<\u002Fspan><span style=\"font-weight:500\">Bypass split shank, prong set<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500\">\n                <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9\"><\u002Fpath><path d=\"M7 8h6\"><\u002Fpath><path d=\"M7 12h4\"><\u002Fpath><circle cx=\"18\" cy=\"14\" r=\"3\"><\u002Fcircle><path d=\"m16.5 16.5-.5 4 2-1 2 1-.5-4\"><\u002Fpath><\u002Fsvg>\n                <span style=\"text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Certificate of authenticity<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid #e5e5e5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ acc.gemstone.toggle }}\" style=\"cursor:pointer;font:inherit;width:100%;background:none;border:none;padding:18px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left\">\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:-0.015em\">Lab-grown gemstone information<\u002Fspan>\n            <span style=\"flex:none;width:26px;height:26px;border:1px solid #e5e5e5;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;line-height:1;color:#0a0a0a\">{{ acc.gemstone.icon }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ acc.gemstone.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 2px 22px;display:flex;flex-direction:column;gap:12px\">\n              <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:#404040;text-wrap:pretty\">Lab-grown sapphires are grown from the same mineral as mined sapphires — identical hardness, refractive index and colour. The only difference is origin, and the price.<\u002Fp>\n              <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:#404040;text-wrap:pretty\">Every stone is graded for colour saturation and clarity before it is set, and ships with its grading report. Grades describe colour and clarity, never size — carat weight is chosen separately in step 2.<\u002Fp>\n              <span style=\"font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start\">Know more<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid #e5e5e5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ acc.shipping.toggle }}\" style=\"cursor:pointer;font:inherit;width:100%;background:none;border:none;padding:18px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left\">\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:-0.015em\">Free shipping &amp; returns<\u002Fspan>\n            <span style=\"flex:none;width:26px;height:26px;border:1px solid #e5e5e5;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;line-height:1;color:#0a0a0a\">{{ acc.shipping.icon }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ acc.shipping.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 2px 22px;display:flex;flex-direction:column;gap:18px\">\n              <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:#404040;text-wrap:pretty\">Every Angara item is custom-made after your order is placed. The Estimated Arrival Date is calculated based on the production time of your item. You can select the delivery date according to your preference at the checkout page.<\u002Fp>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><rect x=\"1\" y=\"6\" width=\"15\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M16 10h4l3 3v5h-7\"><\u002Fpath><circle cx=\"6\" cy=\"18\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"18\" r=\"2\"><\u002Fcircle><\u002Fsvg>\n                <div style=\"display:flex;flex-direction:column;gap:4px\">\n                  <span style=\"font-size:14px;font-weight:600\">Free express shipping<\u002Fspan>\n                  <span style=\"font-size:13.5px;line-height:1.65;color:#404040\">We offer Free Express Shipping and Free Return Shipping within the United States.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M3 6v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6\"><\u002Fpath><path d=\"m9 11 3 3 3-3\"><\u002Fpath><\u002Fsvg>\n                <div style=\"display:flex;flex-direction:column;gap:4px\">\n                  <span style=\"font-size:14px;font-weight:600\">Free 30-day returns<\u002Fspan>\n                  <span style=\"font-size:13.5px;line-height:1.65;color:#404040\">If you are not 100% satisfied with your purchase, you can return it within 30 days from Date of Delivery. We offer free return shipping on all orders.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start\">Know more<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid #e5e5e5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ acc.why.toggle }}\" style=\"cursor:pointer;font:inherit;width:100%;background:none;border:none;padding:18px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left\">\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:-0.015em\">Why shop with us<\u002Fspan>\n            <span style=\"flex:none;width:26px;height:26px;border:1px solid #e5e5e5;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;line-height:1;color:#0a0a0a\">{{ acc.why.icon }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ acc.why.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 2px 22px;display:flex;flex-direction:column;gap:18px\">\n              <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:#404040;text-wrap:pretty\">We're the highest-rated and most-awarded online jeweler with generations of expertise, offering premium-quality handcrafted jewelry at remarkable prices.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center\">\n                  <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18\"><\u002Fpath><path d=\"M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:12.5px;font-weight:500;line-height:1.35\">Ethical sourcing<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center\">\n                  <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:12.5px;font-weight:500;line-height:1.35\">Authenticity guaranteed<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center\">\n                  <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h7l-1 8 9-12h-7z\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:12.5px;font-weight:500;line-height:1.35\">High speed service<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center\">\n                  <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><path d=\"M8 2v4\"><\u002Fpath><path d=\"M16 2v4\"><\u002Fpath><path d=\"M12 14v3l2 1\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:12.5px;font-weight:500;line-height:1.35\">Shine now, pay later<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <section style=\"max-width:1280px;margin:72px auto 0;padding:0 32px;display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px\">\n      <h2 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.025em\">Similar rings<\u002Fh2>\n      <span style=\"font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">View all engagement rings<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n      <sc-for list=\"{{ related }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <div style=\"position:relative;width:100%;aspect-ratio:1/1;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;background:#f5f5f5\">\n            <image-slot id=\"{{ r.slot }}\" shape=\"rect\" placeholder=\"Product photo\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:500;line-height:1.4;text-wrap:pretty\">{{ r.name }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:8px\">\n            <span style=\"font-size:14px;font-weight:600\">{{ r.price }}<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#737373;text-decoration:line-through\">{{ r.was }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1280px;margin:72px auto 0;padding:0 32px;display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px\">\n      <h2 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.025em\">Real proposals, real reviews<\u002Fh2>\n      <span style=\"font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Write a review<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n      <sc-for list=\"{{ reviews }}\" as=\"rv\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid #e5e5e5;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:9px\">\n          <div style=\"letter-spacing:1px;font-size:13px\">★★★★★<\u002Fdiv>\n          <div style=\"font-size:14.5px;font-weight:600;letter-spacing:-0.015em\">{{ rv.title }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:#404040\">{{ rv.body }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#737373;margin-top:auto\">{{ rv.by }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ stickyBar }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid #e5e5e5\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:20px\">\n        <div style=\"flex:none;width:44px;height:44px;border-radius:9px;overflow:hidden;border:1px solid #e5e5e5;background:#f5f5f5\"><image-slot id=\"pdp-sticky\" shape=\"rect\" placeholder=\"\" src=\"69b06601-b10d-48c4-995d-5ffd95e1f9ec\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:2px;min-width:0\">\n          <div style=\"font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Bypass Split Shank Engagement Ring<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ configSummary }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ addToBag }}\" style=\"cursor:pointer;font:inherit;flex:none;padding:13px 26px;border-radius:10px;border:none;background:#0a0a0a;color:#fafafa;font-size:14px;font-weight:600\">{{ ctaText }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;right:24px;bottom:92px;z-index:60;background:#0a0a0a;color:#fafafa;border-radius:12px;padding:14px 18px;font-size:13.5px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m4 12 6 6L20 6\"><\u002Fpath><\u002Fsvg>\n      <span>Added to bag — {{ configSummary }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ stoneBrowserOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeStoneBrowser }}\" style=\"position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:40px\">\n      <div style=\"background:#ffffff;border-radius:14px;width:640px;max-width:100%;padding:26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.02em\">Change gemstone<\u002Fdiv>\n            <div style=\"font-size:13px;color:#737373\">Swap the centre stone. Your setting, carat and metal stay the same.<\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ closeStoneBrowser }}\" style=\"cursor:pointer;font:inherit;background:none;border:none;padding:4px;color:#404040\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px\">\n          <sc-for list=\"{{ stoneOptions }}\" as=\"st\" hint-placeholder-count=\"8\">\n            <button type=\"button\" sc-camel-on-click=\"{{ st.pick }}\" style=\"cursor:pointer;font:inherit;padding:12px 8px;border-radius:11px;background:#ffffff;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid {{ st.bc }}\">\n              <span style=\"width:36px;height:36px;border-radius:9999px;border:1px solid rgba(0,0,0,.12);background:{{ st.swatch }}\"><\u002Fspan>\n              <span style=\"font-size:12.5px;font-weight:500;text-align:center;line-height:1.3\">{{ st.name }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showGifting&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;stickyBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;defaultOrigin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lab&quot;,&quot;natural&quot;],&quot;default&quot;:&quot;lab&quot;,&quot;tsType&quot;:&quot;\\&quot;lab\\&quot; | \\&quot;natural\\&quot;&quot;,&quot;section&quot;:&quot;Defaults&quot;}}\">\nconst SEL = \"#0a0a0a\", LINE = \"#e5e5e5\";\nconst RING = \"0 0 0 3px rgba(10,10,10,.12)\";\nconst money = n => \"$\" + Math.round(n).toLocaleString(\"en-US\");\n\nclass Component extends DCLogic {\n  state = {\n    origin: null, quality: \"best\", carat: 0.60, metal: \"yellow\", size: \"6.5\",\n    gradeHelpOpen: false, engravingOn: false, engText: \"Ajay & Sonal\", engSymbol: \"♥\", engDate: \"02 · 08 · 2026\",\n    photo: 0, skinTone: 0, karat: \"14k\", emiOpen: false,\n    pkg: \"signature\", open: { details: true, gemstone: false, shipping: false, why: false },\n    toastOpen: false, stoneBrowserOpen: false, stone: \"Blue Sapphire\", stoneSwatch: \"#1e40af\"\n  };\n\n  get origin() { return this.state.origin ?? (this.props.defaultOrigin === \"natural\" ? \"natural\" : \"lab\"); }\n\n  qMult = { good: 1.0, better: 1.16, best: 1.4, heirloom: 1.78 };\n  cMult = { 0.33: 0.62, 0.46: 0.8, 0.6: 1.0, 1: 1.55, 1.2: 1.85 };\n\n  price() {\n    const base = 1700 * (this.origin === \"natural\" ? 2.55 : 1);\n    return base * this.qMult[this.state.quality] * this.cMult[this.state.carat] * (this.state.metal === \"white\" ? 1.02 : 1) * (this.state.karat === \"18k\" ? 1.14 : 1);\n  }\n\n  set = (k, v) => () => this.setState({ [k]: v });\n\n  card(sel) { return { bc: sel ? SEL : LINE, shadow: sel ? RING : \"none\", sel }; }\n  pill(sel) { return { bc: sel ? SEL : LINE, bg: sel ? SEL : \"#ffffff\", fg: sel ? \"#fafafa\" : \"#0a0a0a\", sel }; }\n\n  renderVals() {\n    const s = this.state, p = this.price(), origin = this.origin;\n    const qualityName = { good: \"Good\", better: \"Better\", best: \"Best\", heirloom: \"Heirloom\" }[s.quality];\n    const kar = s.karat === \"18k\" ? \"18K\" : \"14K\";\n    const metalName = kar + \" \" + { yellow: \"Yellow Gold\", rose: \"Rose Gold\", white: \"White Gold\" }[s.metal];\n    const originName = origin === \"lab\" ? \"Lab-Grown\" : \"Natural\";\n    const deltas = { good: -0.4, better: -0.24, best: 0, heirloom: 0.38 };\n\n    const body = {\n      details: \"Modern in every detail. This engagement ring features a bezel-set round lab-grown blue sapphire, framed by a bypass split shank. Expertly handcrafted in \" + metalName + \".\\n\\nSKU LSR5066S · Setting: bypass split shank · Bezel-set centre stone · Comes with a certificate of authenticity.\",\n      gemstone: \"Lab-grown sapphires are grown from the same mineral (corundum) as mined sapphires, with identical hardness, refractive index and colour. The only difference is origin.\\n\\nEvery stone is graded for colour saturation and clarity before setting, and ships with its grading report.\",\n      shipping: \"Free express shipping, fully insured. Free 30-day returns, no restocking fee. Free resizing within 60 days of delivery, and free cleaning and inspection for life.\",\n      why: \"Four hundred years of gemstone expertise, no middlemen, and every piece made to order in our own workshops — so the same stone costs roughly 30% less here.\"\n    };\n    const titles = { details: \"Product details\", gemstone: \"About lab-grown sapphires\", shipping: \"Shipping, returns & warranty\", why: \"Why shop with us\" };\n\n    const photoDefs = [\n      [\"pdp-main\", \"Front\"], [\"pdp-t1\", \"Profile\"], [\"pdp-t2\", \"Side\"],\n      [s.skinTone === 0 ? \"pdp-t3\" : \"pdp-hand-\" + s.skinTone, \"On hand\"],\n      [\"pdp-t4\", \"Scale guide\"], [\"pdp-t5\", \"Video\"], [\"pdp-t6\", \"Detail\"], [\"pdp-t7\", \"In box\"]\n    ];\n\n    return {\n      photos: photoDefs.map(([id, label], i) => ({\n        id, label, bc: s.photo === i ? SEL : LINE, pick: this.set(\"photo\", i)\n      })),\n      trackShift: \"translateX(-\" + (s.photo * 12.5) + \"%)\",\n      photoCounter: (s.photo + 1) + \" / \" + photoDefs.length,\n      prevPhoto: () => this.setState(st => ({ photo: (st.photo + 7) % 8 })),\n      nextPhoto: () => this.setState(st => ({ photo: (st.photo + 1) % 8 })),\n\n      price: money(p),\n      comparePrice: money(p / 0.9),\n      financingLine: \"Or \" + money(p / 12) + \"/mo for 12 months at 0% interest.\",\n      emiOpen: s.emiOpen,\n      toggleEmi: () => this.setState(st => ({ emiOpen: !st.emiOpen })),\n      emiPlans: [6, 12, 24].map(t => ({ term: t + \" months · 0% APR\", monthly: money(p / t) + \"/mo\" })),\n\n      originBadge: origin === \"lab\" ? \"LAB GROWN\" : \"NATURAL\",\n      showSkinTones: s.photo === 3,\n      skinTones: [\"#f0d3c0\", \"#dcae87\", \"#b57f52\", \"#7a4b2a\"].map((c, i) => ({\n        swatch: c, label: \"Skin tone \" + (i + 1),\n        bc: s.skinTone === i ? SEL : \"rgba(0,0,0,.15)\",\n        shadow: s.skinTone === i ? \"inset 0 0 0 2px #ffffff\" : \"none\",\n        pick: this.set(\"skinTone\", i)\n      })),\n\n      karats: [{ id: \"14k\", label: \"14K\" }, { id: \"18k\", label: \"18K\" }].map(k => ({\n        label: k.label,\n        bg: s.karat === k.id ? SEL : \"transparent\",\n        fg: s.karat === k.id ? \"#fafafa\" : \"#0a0a0a\",\n        pick: this.set(\"karat\", k.id)\n      })),\n      karatNote: s.karat === \"18k\" ? \"Richer colour, 75% pure gold\" : \"Most durable for daily wear\",\n      showGifting: this.props.showGifting ?? true,\n      stickyBar: this.props.stickyBar ?? true,\n      ctaText: \"Add to bag — \" + money(p),\n      stoneSummary: originName + \" \" + s.stone + \" · \" + qualityName + \" grade · \" + s.carat.toFixed(2) + \" ct\",\n      caratSummary: s.carat.toFixed(2) + \" ct total\",\n      metalSummary: metalName,\n      sizeSummary: \"US \" + s.size,\n      configSummary: originName + \" \" + s.stone + \" · \" + qualityName + \" · \" + s.carat.toFixed(2) + \" ct · \" + metalName + \" · Size \" + s.size,\n\n      origins: [\n        { id: \"lab\", name: \"Lab-Grown\", desc: \"Identical to mined, grown in weeks.\", priceNote: \"From $1,054\" },\n        { id: \"natural\", name: \"Natural\", desc: \"Mined and ethically sourced.\", priceNote: \"From $2,688\" }\n      ].map(o => ({ ...o, ...this.card(origin === o.id), pick: this.set(\"origin\", o.id) })),\n\n      grades: [\n        { id: \"good\", name: \"Good\", desc: \"Even colour, visible inclusions\", slot: \"grade-good\" },\n        { id: \"better\", name: \"Better\", desc: \"Richer colour, eye-clean\", slot: \"grade-better
